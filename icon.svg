<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1f4e"/>
      <stop offset="100%" stop-color="#060e1f"/>
    </linearGradient>
    <!-- IBMEC blue gradient -->
    <linearGradient id="ibBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b9ef5"/>
      <stop offset="100%" stop-color="#003DA5"/>
    </linearGradient>
    <!-- Gold gradient for "+" -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d4870f"/>
    </linearGradient>
    <!-- Gold glow filter -->
    <filter id="glowGold" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Blue glow filter -->
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft glow for decorative elements -->
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Gold border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245,166,35,0.35)"/>
      <stop offset="50%" stop-color="rgba(245,166,35,0.08)"/>
      <stop offset="100%" stop-color="rgba(245,166,35,0.25)"/>
    </linearGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle radial center glow (IBMEC blue atmosphere) -->
  <circle cx="220" cy="260" r="230" fill="rgba(0,61,165,0.14)"/>

  <!-- Decorative background grid lines (subtle) -->
  <g stroke="rgba(59,130,246,0.06)" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- ── "IB" LETTERS – IBMEC BLUE ── -->
  <!-- "I" letter – vertical bar + top/bottom serifs -->
  <!-- Vertical bar -->
  <rect x="82" y="148" width="52" height="216" rx="8" fill="url(#ibBlue)" filter="url(#glowBlue)"/>
  <!-- Top serif -->
  <rect x="62" y="148" width="92" height="32" rx="10" fill="url(#ibBlue)" filter="url(#glowBlue)"/>
  <!-- Bottom serif -->
  <rect x="62" y="332" width="92" height="32" rx="10" fill="url(#ibBlue)" filter="url(#glowBlue)"/>

  <!-- "B" letter – vertical bar + two bumps -->
  <!-- Vertical left bar -->
  <rect x="180" y="148" width="52" height="216" rx="8" fill="url(#ibBlue)" filter="url(#glowBlue)"/>
  <!-- Top horizontal bar -->
  <rect x="180" y="148" width="110" height="32" rx="10" fill="url(#ibBlue)" filter="url(#glowBlue)"/>
  <!-- Middle horizontal bar -->
  <rect x="180" y="240" width="100" height="28" rx="10" fill="url(#ibBlue)" filter="url(#glowBlue)"/>
  <!-- Bottom horizontal bar -->
  <rect x="180" y="332" width="110" height="32" rx="10" fill="url(#ibBlue)" filter="url(#glowBlue)"/>
  <!-- Top bump (upper right of B) -->
  <path d="M290 148 Q370 148 370 212 Q370 268 290 268 L232 268 L232 148 Z"
        fill="url(#ibBlue)" filter="url(#glowBlue)" opacity="0.95"/>
  <!-- Bottom bump (lower right of B) -->
  <path d="M290 268 Q385 268 385 340 Q385 364 290 364 L232 364 L232 268 Z"
        fill="url(#ibBlue)" filter="url(#glowBlue)" opacity="0.95"/>

  <!-- ── GOLD "+" SIGN – upper-right, slightly overlapping ── -->
  <!-- The "+" is dramatic: thick arms with rounded ends, glowing gold -->
  <!-- Horizontal arm of "+" -->
  <rect x="354" y="100" width="142" height="58" rx="29" fill="url(#goldGrad)" filter="url(#glowGold)"/>
  <!-- Vertical arm of "+" -->
  <rect x="396" y="58" width="58" height="142" rx="29" fill="url(#goldGrad)" filter="url(#glowGold)"/>
  <!-- Center highlight (bright inner spot on the "+" cross) -->
  <circle cx="425" cy="129" r="22" fill="rgba(255,255,255,0.18)" filter="url(#softGlow)"/>
  <circle cx="425" cy="129" r="10" fill="rgba(255,255,255,0.25)"/>

  <!-- ── GOLD ACCENT LINE ── -->
  <rect x="62" y="393" width="388" height="4" rx="2" fill="url(#goldGrad)" opacity="0.45"/>

  <!-- ── "STARS" LABEL at bottom ── -->
  <text x="256" y="450"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="36"
    font-weight="700"
    fill="#f5a623"
    text-anchor="middle"
    letter-spacing="11"
    opacity="0.72">STARS</text>

  <!-- ── DECORATIVE ELEMENTS ── -->
  <!-- Small gold star dots scattered -->
  <circle cx="72" cy="74" r="6" fill="#f5a623" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="55" cy="90" r="3" fill="#f5a623" opacity="0.3"/>

  <circle cx="462" cy="380" r="6" fill="#f5a623" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="478" cy="396" r="3" fill="#f5a623" opacity="0.3"/>

  <circle cx="72" cy="438" r="4" fill="#5b9ef5" opacity="0.35" filter="url(#softGlow)"/>
  <circle cx="458" cy="62" r="3" fill="#5b9ef5" opacity="0.3"/>

  <!-- 4-pointed star shape (small accent, bottom left) -->
  <path d="M88 440 L92 452 L104 456 L92 460 L88 472 L84 460 L72 456 L84 452 Z"
        fill="#f5a623" opacity="0.4" filter="url(#softGlow)"/>

  <!-- 4-pointed star (small, top right corner) -->
  <path d="M456 76 L459 85 L468 88 L459 91 L456 100 L453 91 L444 88 L453 85 Z"
        fill="#f5a623" opacity="0.35" filter="url(#softGlow)"/>

  <!-- ── OUTER BORDER ── -->
  <rect x="2" y="2" width="508" height="508" rx="95" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>
</svg>
